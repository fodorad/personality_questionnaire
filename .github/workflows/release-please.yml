name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT, not GITHUB_TOKEN: a tag created with GITHUB_TOKEN does not trigger
      # other workflows, so CD would never fire on the release PR's merge.
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
