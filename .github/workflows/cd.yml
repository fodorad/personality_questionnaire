name: CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: cd
    permissions:
      id-token: write   # required for OIDC trusted publishing to PyPI
      contents: write   # required to create the GitHub Release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # Docker-based action: GitHub resolves the container image by this ref,
        # and pypa only publishes images under version tags -- not commit SHAs --
        # so a SHA pin fails with "manifest unknown". Pin to the release tag.
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
